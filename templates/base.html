<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}FlavorMap{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="{% url 'restaurants:home' %}">FlavorMap</a>
        <div>
            <a class="nav-link d-inline text-white" href="{% url 'restaurants:home' %}">Ana Sayfa</a>
            <a class="nav-link d-inline text-white" href="{% url 'restaurants:restaurant_list' %}">Restoranlar</a>
            <a class="nav-link d-inline text-white" href="{% url 'restaurants:about' %}">Hakkinda</a>
            <a class="nav-link d-inline text-white" href="{% url 'restaurants:contact' %}">Iletisim</a>
        </div>
    </div>
</nav>

<div class="container mt-4">
    {% block content %}{% endblock %}
</div>

<footer class="bg-dark text-white text-center py-3 mt-5">
    <p>FlavorMap 2024</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
