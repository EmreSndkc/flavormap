{% extends 'base.html' %}

{% block title %}Yorumu Düzenle - FlavorMap{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card mt-4">
            <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
                <h3 class="mb-0">Yorumu Düzenle</h3>
                <a href="{% url 'restaurants:restaurant_detail' review.restaurant.pk %}" class="btn btn-sm btn-light">İptal</a>
            </div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button type="submit" class="btn btn-primary">Kaydet</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
